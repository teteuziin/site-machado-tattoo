name: Importar HTML da release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar HTML da release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --pattern 'landing-page-machado-tattoo.html' --dir .
          ls -lh landing-page-machado-tattoo.html
      - name: Commitar arquivo na raiz
        run: |
          git config user.name "teteuziin"
          git config user.email "teteuziin@users.noreply.github.com"
          git add landing-page-machado-tattoo.html
          git commit -m "Landing page Machado Tattoo — site completo"
          git push
